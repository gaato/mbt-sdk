# Registration and publish order (dependencies before their consumers).
[[sdk]]
name = "openai"
dir = "openai"
module = "gaato/openai"
generator = "openapi"
spec_file = "openai/spec/openai.yaml"
spec_url = "https://raw.githubusercontent.com/openai/openai-openapi/manual_spec/openapi.yaml"
spec_fetch = "plain"
include_all = false
derive_operation_ids = false
package = "gaato/openai/gen"
out = "openai/src/gen"
census_args = ["--derive-operation-ids", "--overlay", "openai/overlays/fix.yaml", "--overlay", "openai/overlays/moonbit.yaml"]
report_census_args = ["--overlay", "openai/overlays/fix.yaml"]
offline_packages = ["openai/src", "openai/src/gen", "runtime-tests/src/openai"]
base_url = "https://api.openai.com/v1"
auth = { kind = "bearer" }
publish = true
spec_watch = true

[[sdk]]
name = "anthropic"
dir = "anthropic"
module = "gaato/anthropic"
generator = "openapi"
spec_file = "anthropic/spec/anthropic.json"
spec_url = "https://raw.githubusercontent.com/anthropics/anthropic-sdk-python/main/scripts/mock-spec.json.gz"
spec_fetch = "gzip"
include_all = false
derive_operation_ids = false
package = "gaato/anthropic/gen"
out = "anthropic/src/gen"
census_args = ["--ops", "messages_post,messages_count_tokens_post,models_list,models_get", "--overlay", "anthropic/overlays/moonbit.yaml"]
report_census_args = []
offline_packages = ["anthropic/src", "anthropic/src/gen", "runtime-tests/src/anthropic"]
base_url = "https://api.anthropic.com"
auth = { kind = "header", name = "x-api-key" }
auth_reason = "The vendored mock spec omits securitySchemes; the facade defaults to XApiKey and also supports bearer authentication."
auth_spec = {}
publish = true
spec_watch = true

[[sdk]]
name = "github"
dir = "github"
module = "gaato/github"
generator = "openapi"
spec_file = "github/spec/api.github.com.2022-11-28.yaml"
spec_url = "https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.2022-11-28.yaml"
spec_fetch = "plain"
include_all = true
derive_operation_ids = false
package = "gaato/github/gen"
out = "github/src/gen"
census_args = ["--overlay", "github/overlays/fix.yaml", "--overlay", "github/overlays/moonbit.yaml"]
report_census_args = ["--overlay", "github/overlays/fix.yaml", "--overlay", "github/overlays/moonbit.yaml"]
offline_packages = ["github/src", "github/src/gen", "runtime-tests/src/github"]
base_url = "https://api.github.com"
auth = { kind = "bearer" }
auth_reason = "The vendored REST description omits securitySchemes; the facade sends a bearer token when supplied."
auth_spec = {}
publish = true
spec_watch = true

[[sdk]]
name = "badhttp"
client_layer = true
base_url = "https://badhttp.dev"
auth = { kind = "none" }
dir = "fixtures/gen/badhttp"
module = "gaato/fixture-badhttp"
generator = "openapi"
spec_file = "specs/badhttp/openapi.json"
spec_url = "https://badhttp.dev/openapi.json"
spec_fetch = "plain"
include_all = true
derive_operation_ids = true
package = "gaato/fixture-badhttp"
out = "fixtures/gen/badhttp/src"
census_args = []
report_census_args = []
offline_packages = ["fixtures/gen/badhttp/src", "runtime-tests/src/badhttp_replay"]
publish = false
spec_watch = false

[[sdk]]
name = "petstore3"
client_layer = true
legacy_generic_stream = true
base_url = "https://petstore3.swagger.io/api/v3"
base_url_spec = "/api/v3"
base_url_reason = "The relative server is resolved against the pinned specification origin so the fixture is usable without a hosting page."
auth = { kind = "alternatives", schemes = [{kind = "bearer"}, {kind = "header", name = "api_key"}] }
dir = "fixtures/gen/petstore3"
module = "gaato/fixture-petstore3"
generator = "openapi"
spec_file = "specs/petstore3/openapi.json"
spec_url = "https://petstore3.swagger.io/api/v3/openapi.json"
spec_fetch = "plain"
include_all = true
derive_operation_ids = true
package = "gaato/fixture-petstore3"
out = "fixtures/gen/petstore3/src"
census_args = []
report_census_args = []
offline_packages = ["fixtures/gen/petstore3/src"]
publish = false
spec_watch = false

[[sdk]]
name = "codex"
dir = "codex-protocol"
module = "gaato/codex-protocol"
generator = "custom"
spec_file = "codex-protocol/spec/schema.json"
# Locally produced JSON Schema bundle, not an HTTP spec download.
spec_url = ""
spec_fetch = "plain"
include_all = false
derive_operation_ids = false
package = "gaato/codex-protocol/gen"
out = "codex-protocol/src/gen"
census_args = []
offline_packages = ["codex-protocol/src/gen", "codex-protocol/src/tests"]
command = "tools/gen/codex.py"
publish = false
spec_watch = false

[[sdk]]
name = "jina"
client_layer = true
legacy_generic_stream = true
timeout_ms = 60000
dir = "jina"
module = "gaato/jina"
generator = "openapi"
spec_file = "jina/spec/openapi.json"
spec_url = "https://api.jina.ai/openapi.json"
spec_fetch = "plain"
include_all = true
derive_operation_ids = true
package = "gaato/jina/gen"
out = "jina/src/gen"
census_args = ["--overlay", "jina/overlays/fix.yaml", "--overlay", "jina/overlays/moonbit.yaml"]
report_census_args = ["--overlay", "jina/overlays/fix.yaml"]
offline_packages = ["jina/src", "jina/src/gen"]
base_url = "https://api.jina.ai"
auth = { kind = "bearer" }
publish = false
spec_watch = false

[[sdk]]
name = "replicate"
client_layer = true
legacy_generic_stream = true
legacy_multipart_boundary = true
timeout_ms = 70000
dir = "replicate"
module = "gaato/replicate"
generator = "openapi"
spec_file = "replicate/spec/openapi.json"
spec_url = "https://api.replicate.com/openapi.json"
spec_fetch = "plain"
include_all = true
derive_operation_ids = true
package = "gaato/replicate/gen"
out = "replicate/src/gen"
census_args = ["--overlay", "replicate/overlays/fix.yaml", "--overlay", "replicate/overlays/moonbit.yaml"]
report_census_args = ["--overlay", "replicate/overlays/fix.yaml"]
offline_packages = ["replicate/src", "replicate/src/gen"]
base_url = "https://api.replicate.com/v1"
auth = { kind = "alternatives", schemes = [{ kind = "bearer" }, { kind = "none" }] }
publish = false
spec_watch = false

[sdk.retry]
retries = 5
methods = ["GET", "HEAD", "PUT", "DELETE", "OPTIONS"]
statuses = [429, 500, 502, 503, 504]
status_overrides = [{ methods = ["POST"], statuses = [429] }]
sent_failures = "never"
unprocessed_failures = false
retry_after = "header"
retry_after_cap_ms = 60000
retry_after_cap = "backoff"
zero_means_backoff = false
backoff_base_ms = 500
backoff_max_ms = 60000
jitter = [900, 1100]

[[sdk]]
name = "gemini"
client_layer = true
dir = "gemini"
module = "gaato/gemini"
generator = "discovery"
spec_file = "gemini/spec/discovery.json"
spec_url = "https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta"
spec_fetch = "plain"
include_all = false
derive_operation_ids = true
package = "gaato/gemini/gen"
out = "gemini/src/gen"
census_args = ["--ops", "models_generate_content,models_stream_generate_content,models_embed_content,models_batch_embed_contents,models_count_tokens,models_get,models_list,files_get,files_list,files_delete,media_upload,cached_contents_create,cached_contents_get,cached_contents_list,cached_contents_patch,cached_contents_delete", "--overlay", "gemini/overlays/fix.yaml", "--overlay", "gemini/overlays/moonbit.yaml"]
report_census_args = ["--ops", "models_generate_content,models_stream_generate_content,models_embed_content,models_batch_embed_contents,models_count_tokens,models_get,models_list,files_get,files_list,files_delete,media_upload,cached_contents_create,cached_contents_get,cached_contents_list,cached_contents_patch,cached_contents_delete", "--overlay", "gemini/overlays/fix.yaml", "--overlay", "gemini/overlays/moonbit.yaml"]
offline_packages = ["gemini/src", "gemini/src/gen"]
base_url = "https://generativelanguage.googleapis.com"
auth = { kind = "alternatives", schemes = [{ kind = "header", name = "x-goog-api-key" }, { kind = "query", name = "key" }, { kind = "bearer" }] }
publish = true
spec_watch = true

[sdk.retry]
retries = 4
methods = "any"
statuses = [503]
sent_failures = "never"
unprocessed_failures = true
retry_after = "header"
retry_after_cap_ms = 60000
retry_after_cap = "stop"
zero_means_backoff = false
backoff_base_ms = 1000
backoff_max_ms = 60000
jitter = [1000, 2000]

[[sdk]]
name = "cloudflare_dns"
dir = "cloudflare_dns"
module = "gaato/cloudflare_dns"
generator = "openapi"
spec_file = "specs/cloudflare/openapi.json"
spec_url = "https://raw.githubusercontent.com/cloudflare/api-schemas/main/openapi.json"
spec_fetch = "plain"
include_all = false
derive_operation_ids = false
client_layer = true
package = "gaato/cloudflare_dns/gen"
out = "cloudflare_dns/src/gen"
census_args = []
offline_packages = ["cloudflare_dns/src", "cloudflare_dns/src/gen"]
base_url = "https://api.cloudflare.com/client/v4"
auth = { kind = "alternatives", schemes = [{ kind = "bearer", variant = "ApiToken" }, { kind = "header_bundle", variant = "GlobalApiKey", headers = { email = "X-Auth-Email", key = "X-Auth-Key" } }] }
auth_reason = "The OpenAPI email and key pair is one credential. The deprecated service key is removed and three-way AND requirements are normalized by the overlay."
auth_spec = { api_email = { in = "header", name = "X-Auth-Email", type = "apiKey" }, api_key = { in = "header", name = "X-Auth-Key", type = "apiKey" }, api_token = { scheme = "bearer", type = "http" }, user_service_key = { in = "header", name = "X-Auth-User-Service-Key", type = "apiKey" } }
timeout_ms = 60000
rate_limit_prefix = "cloudflare"
publish = false
spec_watch = true

[sdk.selection]
operations = [
  "zones-get", "zones-post", "zones-0-delete", "zones-0-get", "zones-0-patch",
  "put-zones-zone_id-activation_check",
  "dns-records-for-a-zone-list-dns-records",
  "dns-records-for-a-zone-create-dns-record",
  "dns-records-for-a-zone-batch-dns-records",
  "dns-records-for-a-zone-export-dns-records",
  "dns-records-for-a-zone-import-dns-records",
  "dns-records-for-a-zone-review-dns-scan",
  "dns-records-for-a-zone-apply-dns-scan-results",
  "dns-records-for-a-zone-trigger-dns-scan",
  "dns-records-for-a-zone-delete-dns-record",
  "dns-records-for-a-zone-dns-record-details",
  "dns-records-for-a-zone-patch-dns-record",
  "dns-records-for-a-zone-update-dns-record",
  "dns-settings-for-a-zone-list-dns-settings",
  "dns-settings-for-a-zone-update-dns-settings",
  "dnssec-delete-dnssec-records", "dnssec-dnssec-details", "dnssec-edit-dnssec-status",
]

[sdk.retry]
retries = 2
methods = ["GET", "HEAD", "PUT", "DELETE"]
statuses = [408, 409, 429, [500, 599]]
status_overrides = [{ methods = ["POST", "PATCH"], statuses = [429] }]
guard_response_retries = [{ methods = ["POST", "PATCH"], statuses = [429] }]
sent_failures = ["GET", "HEAD", "PUT", "DELETE"]
unprocessed_failures = true
override_header = "x-should-retry"
retry_after = "ms_then_header"
retry_after_cap_ms = "none"
backoff_base_ms = 500
backoff_max_ms = 8000
jitter = [750, 1000]
