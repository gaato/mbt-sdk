package = "gaato/fixture-badhttp"
out = "fixtures/gen/badhttp/src"
census_args = []
report_census_args = []
offline_packages = ["fixtures/gen/badhttp/src", "runtime-tests/src/badhttp_replay"]
publish = false
spec_watch = false

