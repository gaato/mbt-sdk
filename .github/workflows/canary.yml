name: Canary

# The generator and the overlay applier run Python tooling through uv.

on:
  schedule:
    # 06:17 JST, after gaato/moonbit-docker rebuilds the latest and nightly images.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    uses: gaato/.github/.github/workflows/moonbit-canary.yml@main
    with:
      gates: scripts/gates.sh
      uv: true
