name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      # Pinned toolchain. canary.yml runs the same gates on :latest and :nightly.
      image: ghcr.io/gaato/moonbit:0.10.17-d971670cd
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the workspace (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node (js target tests)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up uv (overlay applier and generator)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Toolchain versions
        run: moon version --all

      - name: Generator unit tests
        run: uv run --with pyyaml --with jsonpath-rfc9535 python -m unittest discover -s tools/gen/tests

      - name: Overlays apply and generated code is current
        run: scripts/generate.sh --check

      - name: Gates
        run: scripts/gates.sh

      - name: Docs audit
        run: moon run scripts/docs_audit.mbtx --self-test

      - name: Coverage ledger
        run: moon run scripts/coverage_report.mbtx
