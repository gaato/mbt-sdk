name: Spec watch

# Fetches the upstream OpenAI, Anthropic and GitHub specs daily. When changed: re-vendor, apply the
# overlays, regenerate, bump the module version when src changed, run the gates,
# and open a PR. When generation, the gates and CI all pass, the PR is merged
# here and release.yml publishes; otherwise it stays open for a human.
# Overlay actions that no longer match (zero-match) or no longer change anything
# (no-op: upstream fixed it) fail the overlay step; their messages go into the
# PR body so a human can prune the overlay.

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  MOONBIT_IMAGE: ghcr.io/gaato/moonbit:0.10.14

jobs:
  watch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openai
            spec_file: openai.yaml
            spec_url: https://raw.githubusercontent.com/openai/openai-openapi/manual_spec/openapi.yaml
          - provider: anthropic
            spec_file: anthropic.json
            spec_url: https://raw.githubusercontent.com/anthropics/anthropic-sdk-python/main/scripts/mock-spec.json.gz
          - provider: github
            spec_file: api.github.com.2022-11-28.yaml
            spec_url: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.2022-11-28.yaml
    env:
      PROVIDER: ${{ matrix.provider }}
      SPEC_FILE: ${{ matrix.spec_file }}
      SPEC_URL: ${{ matrix.spec_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch upstream spec and compare
        id: fetch
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$SPEC_URL" --output "$RUNNER_TEMP/download"
          if [ "$PROVIDER" = anthropic ]; then
            gzip -dc "$RUNNER_TEMP/download" > "$RUNNER_TEMP/$SPEC_FILE"
            echo "gzip_sha=$(sha256sum "$RUNNER_TEMP/download" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            cp "$RUNNER_TEMP/download" "$RUNNER_TEMP/$SPEC_FILE"
          fi
          new="$(sha256sum "$RUNNER_TEMP/$SPEC_FILE" | cut -d' ' -f1)"
          old="$(sha256sum "$PROVIDER/spec/$SPEC_FILE" | cut -d' ' -f1)"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = "$old" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up uv
        if: steps.fetch.outputs.changed == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The generator needs moonfmt and the gates need uv, so both run in the
      # MoonBit image with the host's uv mounted in (the image has no Python).
      - name: Define the MoonBit runner
        if: steps.fetch.outputs.changed == 'true'
        run: |
          cat > "$RUNNER_TEMP/moonbit" <<EOF
          #!/usr/bin/env bash
          exec docker run --rm -v "\$PWD:/work" -w /work \\
            -v "$(command -v uv):/usr/local/bin/uv:ro" \\
            -v "$RUNNER_TEMP/uv-cache:/uv-cache" -e UV_CACHE_DIR=/uv-cache -e UV_PYTHON_INSTALL_DIR=/uv-cache/python \\
            "$MOONBIT_IMAGE" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/moonbit"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Re-vendor and regenerate
        if: steps.fetch.outputs.changed == 'true'
        id: regen
        run: |
          cp "$RUNNER_TEMP/$SPEC_FILE" "$PROVIDER/spec/$SPEC_FILE"
          today="$(date -u +%F)"
          sed -i -E "s/^- Fetched: .*/- Fetched: $today/; s/^- sha256: .*/- sha256: ${{ steps.fetch.outputs.new }}/" "$PROVIDER/spec/SOURCE.md"
          if [ "$PROVIDER" = anthropic ]; then
            sed -i -E "s/^- sha256 \(gzip as downloaded\): .*/- sha256 (gzip as downloaded): ${{ steps.fetch.outputs.gzip_sha }}/" "$PROVIDER/spec/SOURCE.md"
          fi
          set +e
          moonbit scripts/generate.sh > "$RUNNER_TEMP/generate.log" 2>&1
          status=$?
          echo "generate_status=$status" >> "$GITHUB_OUTPUT"
          echo "generate.sh exited $status"; tail -n 20 "$RUNNER_TEMP/generate.log"
          set -e
          # Each container starts without the registry index, which moon info needs.
          moonbit bash -c 'moon update && moon fmt && moon info' || true

      # Only src ships. A spec change that leaves src alone releases nothing; a
      # src change with the same public API (.mbti) is a patch. Generated types
      # are pub(all), so any public API change is breaking: minor while 0.x.
      - name: Bump the module version
        if: steps.fetch.outputs.changed == 'true'
        id: bump
        run: |
          if [ -z "$(git status --porcelain -- "$PROVIDER/src")" ]; then
            echo "Nothing under $PROVIDER/src changed; no release."
            exit 0
          fi
          current="$(sed -nE 's/^version = "(.*)"$/\1/p' "$PROVIDER/moon.mod")"
          IFS=. read -r major minor patch <<< "$current"
          if [ -n "$(git status --porcelain -- ":(glob)$PROVIDER/src/**/*.mbti")" ]; then
            kind="public API changed"
            if [ "$major" = 0 ]; then next="0.$((minor + 1)).0"; else next="$((major + 1)).0.0"; fi
          else
            kind="public API unchanged"
            next="$major.$minor.$((patch + 1))"
          fi
          scripts/release.sh bump "$PROVIDER" "$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "summary=$current → $next ($kind)" >> "$GITHUB_OUTPUT"

      - name: Gates (native and wasm-gc; the PR's CI run adds js)
        if: steps.fetch.outputs.changed == 'true'
        id: gates
        run: |
          set +e
          moonbit scripts/gates.sh --no-js > "$RUNNER_TEMP/gates.log" 2>&1
          status=$?
          echo "gates_status=$status" >> "$GITHUB_OUTPUT"
          echo "gates.sh exited $status"; tail -n 20 "$RUNNER_TEMP/gates.log"

      - name: Open pull request
        if: steps.fetch.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash="${{ steps.fetch.outputs.new }}"
          branch="spec-watch/$PROVIDER/${hash:0:20}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Same upstream hash as an earlier run: reuse its PR (it may still be
          # waiting for a merge), or stop if someone closed it.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            pr="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
            if [ -z "$pr" ]; then
              echo "::error::$branch exists without an open PR; delete the branch to regenerate it."
              exit 1
            fi
            echo "An open PR (#$pr) already tracks $branch."
            echo "number=$pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A -- "$PROVIDER" ':(glob)*/moon.mod'
          git commit -m "Update vendored $PROVIDER spec and regenerate"
          git push origin "$branch"
          {
            echo "Upstream spec changed (sha256 \`${{ steps.fetch.outputs.new }}\`)."
            echo
            echo "- overlay + generator exit status: \`${{ steps.regen.outputs.generate_status }}\`"
            echo "- gates exit status: \`${{ steps.gates.outputs.gates_status }}\`"
            echo "- release: ${{ steps.bump.outputs.summary || 'none (nothing under src changed)' }}"
            echo
            echo "Spec watch merges this PR itself when both are \`0\` and CI passes; otherwise it waits for a human."
            echo
            echo '<details><summary>generate.log</summary>'; echo; echo '```'; tail -n 80 "$RUNNER_TEMP/generate.log"; echo '```'; echo '</details>'
            echo '<details><summary>gates.log (tail)</summary>'; echo; echo '```'; tail -n 60 "$RUNNER_TEMP/gates.log"; echo '```'; echo '</details>'
          } > "$RUNNER_TEMP/body.md"
          url="$(gh pr create --base main --head "$branch" \
            --title "Update vendored $PROVIDER spec" --body-file "$RUNNER_TEMP/body.md")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      # pull_request runs for PRs opened with GITHUB_TOKEN wait for approval, but
      # workflow_dispatch runs start at once and report on the branch head.
      - name: Merge when generation, gates and CI pass
        if: steps.pr.outputs.number != '' && steps.regen.outputs.generate_status == '0' && steps.gates.outputs.gates_status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          PR: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          sha="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          find_run() {
            gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch \
              --json databaseId,headSha --jq "map(select(.headSha == \"$sha\"))[0].databaseId // empty"
          }
          run="$(find_run)"
          if [ -z "$run" ]; then
            gh workflow run ci.yml --ref "$BRANCH"
            for _ in $(seq 30); do sleep 5; run="$(find_run)"; [ -n "$run" ] && break; done
          fi
          if [ -z "$run" ]; then
            echo "::error::No CI run appeared for $BRANCH; leaving PR #$PR for review."
            exit 1
          fi
          if ! gh run watch "$run" --exit-status > /dev/null; then
            echo "::error::CI run $run failed; leaving PR #$PR for review."
            exit 1
          fi
          gh pr merge "$PR" --squash --match-head-commit "$sha"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          # A merge made with GITHUB_TOKEN starts no CI run on main, so the
          # workflow_run trigger of release.yml never fires; dispatch it instead.
          if [ -n "$VERSION" ]; then
            gh workflow run release.yml --ref main
          fi

      - name: Flag for review
        if: steps.pr.outputs.number != '' && (steps.regen.outputs.generate_status != '0' || steps.gates.outputs.gates_status != '0')
        run: |
          echo "::error::Generation or gates failed; PR #${{ steps.pr.outputs.number }} needs a human."
          exit 1
