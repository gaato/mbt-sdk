name: Spec watch

# One daily job per vendored source; publication is batched weekly.
on:
  schedule:
    - cron: "43 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_IMAGE: ghcr.io/gaato/moonbit:0.10.21-06da1ed44

jobs:
  matrix:
    runs-on: ubuntu-26.04
    outputs:
      specs: ${{ steps.sdks.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sdks
        run: echo "matrix=$(python3 tools/sdks.py matrix)" >> "$GITHUB_OUTPUT"

  watch:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.specs) }}
    concurrency:
      group: spec-watch-${{ matrix.provider }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      PROVIDER: ${{ matrix.provider }}
      SPEC_FILE: ${{ matrix.spec_file }}
      SPEC_PATH: ${{ matrix.spec_path }}
      SPEC_URL: ${{ matrix.spec_url }}
      SPEC_FETCH: ${{ matrix.spec_fetch }}
      GENERATOR: ${{ matrix.generator }}
      MODULE_DIRS: ${{ toJSON(matrix.dirs) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch once and compare
        id: fetch
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$SPEC_URL" --output "$RUNNER_TEMP/download"
          if [ "$SPEC_FETCH" = gzip ]; then
            gzip -dc "$RUNNER_TEMP/download" > "$RUNNER_TEMP/$SPEC_FILE"
            echo "gzip_sha=$(sha256sum "$RUNNER_TEMP/download" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            cp "$RUNNER_TEMP/download" "$RUNNER_TEMP/$SPEC_FILE"
          fi
          new="$(sha256sum "$RUNNER_TEMP/$SPEC_FILE" | cut -d' ' -f1)"
          old="$(sha256sum "$SPEC_PATH" | cut -d' ' -f1)"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          changed=true
          if [ "$new" = "$old" ]; then
            changed=false
          elif [ "$GENERATOR" = discovery ] && python3 tools/gen/discovery.py watch-equal "$SPEC_PATH" "$RUNNER_TEMP/$SPEC_FILE"; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        if: steps.fetch.outputs.changed == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Define the MoonBit runner
        if: steps.fetch.outputs.changed == 'true'
        run: |
          cat > "$RUNNER_TEMP/moonbit" <<EOF
          #!/usr/bin/env bash
          exec docker run --rm -v "\$PWD:/work" -w /work \\
            -v "$(command -v uv):/usr/local/bin/uv:ro" \\
            -v "$RUNNER_TEMP/uv-cache:/uv-cache" -e UV_CACHE_DIR=/uv-cache -e UV_PYTHON_INSTALL_DIR=/uv-cache/python \\
            "$MOONBIT_IMAGE" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/moonbit"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Re-vendor once and process every consumer
        if: steps.fetch.outputs.changed == 'true'
        id: consumers
        env:
          NEW_SHA: ${{ steps.fetch.outputs.new }}
          GZIP_SHA: ${{ steps.fetch.outputs.gzip_sha }}
        run: |
          cp "$RUNNER_TEMP/$SPEC_FILE" "$SPEC_PATH"
          source_file="$(dirname "$SPEC_PATH")/SOURCE.md"
          today="$(date -u +%F)"
          sed -i -E "s/^- Fetched: .*/- Fetched: $today/; s/^- sha256: .*/- sha256: $NEW_SHA/" "$source_file"
          if [ "$GENERATOR" = discovery ]; then
            revision="$(python3 tools/gen/discovery.py revision "$SPEC_PATH")"
            sed -i -E "s/^- Discovery revision: .*/- Discovery revision: $revision/" "$source_file"
          fi
          if [ "$SPEC_FETCH" = gzip ]; then
            sed -i -E "s/^- sha256 \(gzip as downloaded\): .*/- sha256 (gzip as downloaded): $GZIP_SHA/" "$source_file"
          fi
          status=0
          python3 tools/spec_watch.py --spec-path "$SPEC_PATH" --log-dir "$RUNNER_TEMP/consumers" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ ! -f "$RUNNER_TEMP/consumers/body.md" ]; then
            mkdir -p "$RUNNER_TEMP/consumers"
            echo 'Consumer processing failed before producing its table; manual review required.' > "$RUNNER_TEMP/consumers/body.md"
          fi
          cat "$RUNNER_TEMP/consumers/body.md"
      - name: Open one PR for the shared source
        if: steps.fetch.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.fetch.outputs.new }}
        run: |
          branch="spec-watch/$PROVIDER/${NEW_SHA:0:20}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            pr="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
            [ -n "$pr" ] || { echo "::error::$branch exists without an open PR"; exit 1; }
            echo "number=$pr" >> "$GITHUB_OUTPUT"
            # Fresh local results cannot establish that an older PR has the same patch.
            echo "reused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A -- "$SPEC_PATH" "$(dirname "$SPEC_PATH")/SOURCE.md"
          mapfile -t dirs < <(python3 -c 'import json,os; print("\n".join(json.loads(os.environ["MODULE_DIRS"])))')
          git add -A -- "${dirs[@]}"
          git commit -m "Update shared $PROVIDER spec and regenerate its consumers"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" --title "Update shared $PROVIDER spec" --body-file "$RUNNER_TEMP/consumers/body.md")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
      - name: Merge only after all consumers and exact-head CI pass
        if: steps.pr.outputs.number != '' && steps.pr.outputs.reused != 'true' && steps.consumers.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          sha="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          find_run() {
            gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --json databaseId,headSha --jq "map(select(.headSha == \"$sha\"))[0].databaseId // empty"
          }
          run="$(find_run)"
          if [ -z "$run" ]; then
            gh workflow run ci.yml --ref "$BRANCH"
            for _ in $(seq 30); do sleep 5; run="$(find_run)"; [ -n "$run" ] && break; done
          fi
          [ -n "$run" ] || { echo '::error::CI run did not appear; leaving PR open'; exit 1; }
          gh run watch "$run" --exit-status > /dev/null
          gh pr merge "$PR" --squash --match-head-commit "$sha"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
      - name: Flag failed consumers
        if: steps.pr.outputs.number != '' && steps.consumers.outputs.status != '0'
        run: |
          echo '::error::A consumer stage failed; see the per-module PR table.'
          exit 1

