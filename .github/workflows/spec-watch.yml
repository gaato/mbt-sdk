name: Spec watch

# Fetches the upstream OpenAI, Anthropic and GitHub specs daily. When changed: re-vendor, apply the
# overlays, regenerate, run the gates, and open a PR. Overlay actions that no
# longer match (zero-match) or no longer change anything (no-op: upstream fixed
# it) fail the overlay step; their messages go into the PR body so a human can
# prune the overlay.

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  MOONBIT_IMAGE: ghcr.io/gaato/moonbit:0.10.14

jobs:
  watch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openai
            spec_file: openai.yaml
            spec_url: https://raw.githubusercontent.com/openai/openai-openapi/manual_spec/openapi.yaml
          - provider: anthropic
            spec_file: anthropic.json
            spec_url: https://raw.githubusercontent.com/anthropics/anthropic-sdk-python/main/scripts/mock-spec.json.gz
          - provider: github
            spec_file: api.github.com.2022-11-28.yaml
            spec_url: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.2022-11-28.yaml
    env:
      PROVIDER: ${{ matrix.provider }}
      SPEC_FILE: ${{ matrix.spec_file }}
      SPEC_URL: ${{ matrix.spec_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch upstream spec and compare
        id: fetch
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$SPEC_URL" --output "$RUNNER_TEMP/download"
          if [ "$PROVIDER" = anthropic ]; then
            gzip -dc "$RUNNER_TEMP/download" > "$RUNNER_TEMP/$SPEC_FILE"
            echo "gzip_sha=$(sha256sum "$RUNNER_TEMP/download" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            cp "$RUNNER_TEMP/download" "$RUNNER_TEMP/$SPEC_FILE"
          fi
          new="$(sha256sum "$RUNNER_TEMP/$SPEC_FILE" | cut -d' ' -f1)"
          old="$(sha256sum "$PROVIDER/spec/$SPEC_FILE" | cut -d' ' -f1)"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = "$old" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up uv
        if: steps.fetch.outputs.changed == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The generator needs moonfmt and the gates need uv, so both run in the
      # MoonBit image with the host's uv mounted in (the image has no Python).
      - name: Define the MoonBit runner
        if: steps.fetch.outputs.changed == 'true'
        run: |
          cat > "$RUNNER_TEMP/moonbit" <<EOF
          #!/usr/bin/env bash
          exec docker run --rm -v "\$PWD:/work" -w /work \\
            -v "$(command -v uv):/usr/local/bin/uv:ro" \\
            -v "$RUNNER_TEMP/uv-cache:/uv-cache" -e UV_CACHE_DIR=/uv-cache -e UV_PYTHON_INSTALL_DIR=/uv-cache/python \\
            "$MOONBIT_IMAGE" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/moonbit"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Re-vendor and regenerate
        if: steps.fetch.outputs.changed == 'true'
        id: regen
        run: |
          cp "$RUNNER_TEMP/$SPEC_FILE" "$PROVIDER/spec/$SPEC_FILE"
          today="$(date -u +%F)"
          sed -i -E "s/^- Fetched: .*/- Fetched: $today/; s/^- sha256: .*/- sha256: ${{ steps.fetch.outputs.new }}/" "$PROVIDER/spec/SOURCE.md"
          if [ "$PROVIDER" = anthropic ]; then
            sed -i -E "s/^- sha256 \(gzip as downloaded\): .*/- sha256 (gzip as downloaded): ${{ steps.fetch.outputs.gzip_sha }}/" "$PROVIDER/spec/SOURCE.md"
          fi
          set +e
          moonbit scripts/generate.sh > "$RUNNER_TEMP/generate.log" 2>&1
          echo "generate_status=$?" >> "$GITHUB_OUTPUT"
          set -e
          moonbit bash -c 'moon fmt && moon info' || true

      - name: Gates (native and wasm-gc; the PR's CI run adds js)
        if: steps.fetch.outputs.changed == 'true'
        id: gates
        run: |
          set +e
          moonbit scripts/gates.sh --no-js > "$RUNNER_TEMP/gates.log" 2>&1
          echo "gates_status=$?" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash="${{ steps.fetch.outputs.new }}"
          branch="spec-watch/$PROVIDER/${hash:0:20}"
          # Same upstream hash as an earlier run: leave its branch and PR alone.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
              echo "An open PR already tracks $branch; nothing to do."
              exit 0
            fi
            echo "::error::$branch exists without an open PR; delete the branch to regenerate it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A "$PROVIDER"
          git commit -m "Update vendored $PROVIDER spec and regenerate"
          git push origin "$branch"
          {
            echo "Upstream spec changed (sha256 \`${{ steps.fetch.outputs.new }}\`)."
            echo
            echo "- overlay + generator exit status: \`${{ steps.regen.outputs.generate_status }}\`"
            echo "- gates exit status: \`${{ steps.gates.outputs.gates_status }}\`"
            echo
            echo '<details><summary>generate.log</summary>'; echo; echo '```'; tail -n 80 "$RUNNER_TEMP/generate.log"; echo '```'; echo '</details>'
            echo '<details><summary>gates.log (tail)</summary>'; echo; echo '```'; tail -n 60 "$RUNNER_TEMP/gates.log"; echo '```'; echo '</details>'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" \
            --title "Update vendored $PROVIDER spec" --body-file "$RUNNER_TEMP/body.md"
          # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows,
          # but workflow_dispatch is exempt; its checks land on the branch head.
          gh workflow run ci.yml --ref "$branch"
