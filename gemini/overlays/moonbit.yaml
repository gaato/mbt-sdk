{
  "overlay": "1.0.0",
  "info": {
    "title": "Gemini scope, field oneof and facade ergonomics",
    "version": "1.0.0"
  },
  "actions": [
    {
      "target": "$",
      "update": {
        "x-moonbit-nonraising-decoders": true
      },
      "description": "All generated decoders return Result without raising. A concrete callback effect avoids the pinned compiler's link-core assertion on typed facade calls; existing SDK APIs retain their original effect."
    },
    {
      "target": "$.components.schemas.Part",
      "remove": true,
      "description": "Replace the Discovery flat data fields with the proto oneof; keep every non-data field on each payload."
    },
